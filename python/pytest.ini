[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# 测试标记定义
markers =
           # 模块标记
           store: Store模块测试
           user: User模块测试
           setting: Setting模块测试
           language: Language模块测试
           currency: Currency模块测试
           auth: 认证授权模块测试
           attribute_group: AttributeGroup模块测试
           option: Option模块测试
           option_value: OptionValue模块测试
           category: Category模块测试
           product: Product模块测试
           manufacturer: Manufacturer模块测试
           permission: 权限测试
    
    # 测试类型标记
    smoke: 冒烟测试 - 快速验证核心功能
    regression: 回归测试 - 完整功能测试
    api: API接口测试
    model: 数据模型测试
    service: 服务层测试
    business: 业务场景测试
    integration: 集成测试
    performance: 性能测试
    
    # 优先级标记
    critical: 关键功能测试
    high: 高优先级测试
    medium: 中优先级测试
    low: 低优先级测试
    
    # 其他标记
    slow: 慢速测试（执行时间较长）

